name: release

# Attaches the built app to each release, to host it anywhere (any static file server works).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -qr "../yoyu-${{ github.event.release.tag_name }}.zip" .
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" yoyu-*.zip --clobber
